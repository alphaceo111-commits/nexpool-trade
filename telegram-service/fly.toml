# NEXPOOL Telegram integration service.
#
# IMPORTANT: exactly ONE machine, no autoscaling. The vault is a single
# encrypted file; two machines would diverge. Login challenges also live in
# process memory, so scale-to-zero is disabled.
app = "nexpool-telegram"
primary_region = "fra"

[build]

[mounts]
source = "nexpool_tg_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = false
min_machines_running = 1

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1

[checks.health]
type = "http"
port = 8080
path = "/health"
interval = "30s"
timeout = "5s"
grace_period = "10s"
